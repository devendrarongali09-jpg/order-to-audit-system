
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Order to Audit System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            width: 100%;
            max-width: 410px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h1 {
            color: #286d91;
            font-size: 25px;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd3dc;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #286d91;
            border-color: transparent;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #286d91;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #205875;
        }

        .error {
            color: #c0392b;
            background: #fff0f0;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #64748b;
            font-size: 12px;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <h1>Order to Audit System</h1>

        <p class="subtitle">
            Management System Login
        </p>

        {% if form.errors %}
            <div class="error">
                Invalid username or password.
                Please try again.
            </div>
        {% endif %}

        {% if next %}
            <p class="subtitle">
                Please log in to access the dashboard.
            </p>
        {% endif %}

        <form method="post">

            {% csrf_token %}

            <label for="{{ form.username.id_for_label }}">
                Username
            </label>

            {{ form.username }}

            <label for="{{ form.password.id_for_label }}">
                Password
            </label>

            {{ form.password }}

            <input
                type="hidden"
                name="next"
                value="{{ next }}"
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div class="footer">
            Order-to-Audit Management System
        </div>

    </div>

</body>
</html>
